[project]
name = "mediplug"
version = "0.1.0"
description = "MediPlug async middleware — ingest gateway, worker engine, code mapping, pre-flight rules, FHIR builder, dispatch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "xlrd>=2.0",
    "rapidfuzz>=3.9",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "fhir.resources>=7.1",
    "psycopg-pool>=3.3.1",
    "supabase>=2.31.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediplug"]

[tool.ruff]
line-length = 100
target-version = "py311"
