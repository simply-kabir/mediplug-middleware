services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Only if you're NOT using hosted Supabase
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: mediplug
      POSTGRES_DB: mediplug
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  redis-data:
  pg-data:
